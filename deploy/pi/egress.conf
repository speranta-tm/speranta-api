# Speranța egress proxy (tinyproxy, its own instance: speranta-egress.service, user speranta-egress).
# The API's network guard (nft inet speranta_guard) lets the app users reach only their Postgres and
# THIS proxy; the proxy lets them reach only the hosts in the filter file.
# Installed as /etc/speranta/egress.conf. Loopback only: never 0.0.0.0 (the tailnet bypasses UFW).
Listen 127.0.0.1
Port 8898
Timeout 60
MaxClients 20
Allow 127.0.0.1
# CONNECT only, to HTTPS (Web Push) and SMTP submission (Gmail, STARTTLS). FilterURLs On makes the
# filter see CONNECT targets as "host:port" and every other request as "http://...", so the
# allow-list ("^host:port$" entries) refuses plain HTTP too.
ConnectPort 443
ConnectPort 587
Filter "/etc/speranta/egress-allow"
FilterType ere
FilterURLs On
FilterDefaultDeny Yes
DisableViaHeader Yes
# Connect: logs each tunnel as "CONNECT host:port" (no paths, no tokens) and every refusal.
LogLevel Connect
Syslog On
