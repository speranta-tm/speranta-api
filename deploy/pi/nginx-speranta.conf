# Speranța API (github.com/speranta-tm/speranta-api). Services: speranta-api (prod, :5094) and
# speranta-api-stage (stage, :5095), both on 127.0.0.1. Installed as /etc/nginx/sites-available/speranta
# (+ the sites-enabled link). TLS: certbot cert "speranta" for both names.
# The API trusts X-Forwarded-For from loopback only (Setup/ReverseProxySetup.cs), so the per-IP rate
# limits see the real client.
server {
    server_name sperantatm-api.thorsp.net;
    if ($piguard_deny) { return 403; }  # piguard kill switch
    access_log /var/log/nginx/speranta.access.log combined_host;
    location / {
        proxy_pass http://127.0.0.1:5094/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The largest upload is the monthly flyer, a PDF of up to 20 MB (Storage/FileStorage.cs).
        client_max_body_size 21m;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/speranta/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speranta/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    server_name sperantatm-api-stage.thorsp.net;
    if ($piguard_deny) { return 403; }  # piguard kill switch
    access_log /var/log/nginx/speranta.access.log combined_host;
    location / {
        proxy_pass http://127.0.0.1:5095/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 21m;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/speranta/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/speranta/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    server_name sperantatm-api.thorsp.net sperantatm-api-stage.thorsp.net;
    if ($piguard_deny) { return 403; }  # piguard kill switch
    return 301 https://$host$request_uri;
}
